<!doctype html>
<html>
    <head>
        <title>Hangman</title>
        <meta charset="UTF-8" />
        <link href="hangman.css" rel="stylesheet" type="text/css" />
        <script src="lib/GameController.js" type="text/javascript"></script>
        <!-- Put your JavaScript code in 'hangman.js' and use GameController.x methods -->
        <script src="hangman.js" type="text/javascript"></script>
    </head>

    <body>
        <div class="title">
            <h1>HANGMAN</h1>
        </div>
        <div id="start-container">
            <h2 class="start-subtext">Select your Category</h2>
            <select id="category-selector"></select>
            <button id="start-button">Start Game</button>
        </div>
        <div id="result-container">
            <div id="result-message-container"></div>
            <button id="play-again-button">Play Again</button>
        </div>
        <div id="game-container">
            <div class="content-container">
                <div class="letter-container" id="letter-buttons"></div>
                <div class="hang-man-container">
                    <h2 id="counter"></h2>
                    <canvas
                        id="hangman-canvas"
                        width="700px"
                        height="600px"
                    ></canvas>
                    <div id="found-container"></div>
                </div>
            </div>
        </div>
    </body>
</html>
